  <style>
    body {
      background: #fbf3f2;
      padding: 16px 12px 60px;
    }
    .demo-wrapper {
      max-width: 600px;
      margin: 0 auto;
    }
    .demo-notice {
      background: #eef7f2;
      border: 1px solid #cce5d6;
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 18px;
      font-size: 13px;
      line-height: 1.6;
      color: #2b593f;
    }

    /* 預約看板容器 (手機端高質感卡片) */
    .slots-card {
      background: #fffdfb;
      border: 1px solid rgba(38,34,38,0.1);
      border-radius: 20px;
      padding: 22px 18px;
      box-shadow: 0 10px 30px rgba(38,34,38,0.05);
      position: relative;
    }
    @media (max-width: 480px) {
      .slots-card {
        padding: 18px 14px;
        border-radius: 18px;
      }
    }

    .slots-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(38,34,38,0.06);
      padding-bottom: 14px;
    }
    .slots-title-group h2 {
      font-family: var(--lk-serif);
      font-size: 21px;
      color: #262226;
      font-weight: 600;
      margin: 0 0 4px 0;
      letter-spacing: 0.04em;
    }
    .slots-title-group h2::before { display: none; }
    .slots-title-group p {
      font-size: 12px;
      color: #6f6668;
      margin: 0;
    }
    .slots-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: #f6e3e1;
      color: #bd6875;
      font-size: 11px;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 99px;
      white-space: nowrap;
    }
    .slots-badge::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #34c759;
      box-shadow: 0 0 0 2px rgba(52,199,89,0.25);
    }

    /* 日期水平滑動選擇列 (手機觸控特化) */
    .date-scroll-wrap {
      position: relative;
      margin: 0 -4px 16px;
    }
    .date-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 4px 4px 10px;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      scroll-snap-type: x mandatory;
    }
    .date-scroll::-webkit-scrollbar {
      display: none;
    }
    .date-btn {
      flex: 0 0 68px;
      scroll-snap-align: start;
      background: #fbf3f2;
      border: 1px solid rgba(38,34,38,0.12);
      border-radius: 14px;
      padding: 8px 2px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .date-btn:active {
      transform: scale(0.96);
    }
    .date-btn.active {
      background: #bd6875;
      border-color: #bd6875;
      color: #fff;
      box-shadow: 0 4px 14px rgba(189,104,117,0.32);
    }
    .date-btn .btn-week {
      font-size: 11px;
      color: #6f6668;
      margin-bottom: 2px;
    }
    .date-btn.active .btn-week {
      color: rgba(255,255,255,0.88);
    }
    .date-btn .btn-date {
      font-size: 15px;
      font-weight: 600;
      font-family: var(--lk-serif);
    }

    /* 時段卡片區域 */
    .time-grid-wrapper {
      min-height: 140px;
    }
    .time-section-title {
      font-size: 12px;
      color: #6f6668;
      letter-spacing: 0.06em;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .time-section-title::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(38,34,38,0.06);
    }
    .time-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }
    @media (max-width: 420px) {
      .time-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }
    }
    .time-chip {
      background: #ffffff;
      border: 1px solid rgba(38,34,38,0.12);
      border-radius: 11px;
      padding: 10px 0;
      text-align: center;
      font-size: 14px;
      font-weight: 500;
      color: #262226;
      cursor: pointer;
      transition: all 0.15s ease;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .time-chip:active {
      transform: scale(0.96);
    }
    .time-chip.active {
      background: #262226;
      border-color: #262226;
      color: #fffdfb;
      box-shadow: 0 4px 10px rgba(38,34,38,0.22);
    }

      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid rgba(38,34,38,0.06);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    @media (min-width: 520px) {
      .slots-actions-dual {
        flex-direction: row;
      }
    }
    .btn-action-primary {
      flex: 1.3;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 50px;
      background: #06c755;
      color: #ffffff !important;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.04em;
      border-radius: 99px;
      box-shadow: 0 4px 14px rgba(6,199,85,0.28);
      text-decoration: none;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
      padding: 0 16px;
    }
    .btn-action-primary:active {
      transform: scale(0.98);
      background: #05b34c;
    }

      flex: 1;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      min-height: 50px;

      font-size: 14px;
      font-weight: 500;

    }

  <script>
    (async function initSlots() {
      const dateScrollContainer = document.getElementById('dateScrollContainer');
      const timeGridContainer = document.getElementById('timeGridContainer');
      const currentDateTitle = document.getElementById('currentDateTitle');
      const lineActionBtn = document.getElementById('lineActionBtn');
      const lineBtnText = document.getElementById('lineBtnText');
      const freetimeActionBtn = document.getElementById('freetimeActionBtn');

      const LINE_BASE_URL = "https://page.line.me/026xbaov";
      const FREETIME_BASE_URL = "https://myfreetime.io/shop/qijiskin/booking";

      let slotsData = null;
      try {
        const rawJsonEl = document.getElementById('embedded-slots-data');
        if (rawJsonEl && rawJsonEl.textContent.trim()) {
          slotsData = JSON.parse(rawJsonEl.textContent.trim());
        }
      } catch (e) {}

      // 若在 HTTP/HTTPS 環境，嘗試拉取最新 slots.json
      if (window.location.protocol.startsWith('http')) {
        try {
          const resp = await fetch('slots.json?v=' + Date.now());
          if (resp.ok) {
            slotsData = await resp.json();
          }
        } catch (e) {}
      }

      if (!slotsData || !slotsData.dates || slotsData.dates.length === 0) {
        dateScrollContainer.innerHTML = '<div class="empty-state">近期時段皆已滿約，歡迎直接加 LINE 詢問候補</div>';
        return;
      }

      let selectedDate = null;
      let selectedTime = null;

      // 渲染日期清單
      dateScrollContainer.innerHTML = '';
      slotsData.dates.forEach((d, idx) => {
        const btn = document.createElement('div');
        btn.className = 'date-btn' + (idx === 0 ? ' active' : '');
        btn.innerHTML = `
          <div class="btn-week">${d.dayOfWeek}</div>
          <div class="btn-date">${d.displayDate}</div>
        `;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.date-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          selectDate(d);
        });
        dateScrollContainer.appendChild(btn);
      });

      // 預設選擇第一天
      selectDate(slotsData.dates[0]);

      function selectDate(dateObj) {
        selectedDate = dateObj;
        selectedTime = null;
        updateButtons();

        currentDateTitle.textContent = `${dateObj.date}（${dateObj.dayOfWeek}）可約時段`;
        timeGridContainer.innerHTML = '';

        if (!dateObj.slots || dateObj.slots.length === 0) {
          timeGridContainer.innerHTML = '<div class="empty-state">本日無可約時段</div>';
          return;
        }

        dateObj.slots.forEach(time => {
          const chip = document.createElement('div');
          chip.className = 'time-chip';
          chip.textContent = time;
          chip.addEventListener('click', () => {
            document.querySelectorAll('.time-chip').forEach(c => c.classList.remove('active'));
            chip.classList.add('active');
            selectedTime = time;
            updateButtons();
          });
          timeGridContainer.appendChild(chip);
        });
      }

      function updateButtons() {
        if (selectedDate && selectedTime) {
          lineBtnText.textContent = `加 LINE 預約 ${selectedDate.displayDate} ${selectedTime}`;
          lineActionBtn.href = `${LINE_BASE_URL}?openQrModal=true`;
          freetimeActionBtn.href = `${FREETIME_BASE_URL}`;
        } else if (selectedDate) {
          lineBtnText.textContent = `加 LINE 預約 ${selectedDate.displayDate}（${selectedDate.dayOfWeek}）`;
          lineActionBtn.href = `${LINE_BASE_URL}?openQrModal=true`;
          freetimeActionBtn.href = `${FREETIME_BASE_URL}`;
        } else {
          lineBtnText.textContent = "加 LINE 預約";
          lineActionBtn.href = `${LINE_BASE_URL}?openQrModal=true`;
          freetimeActionBtn.href = `${FREETIME_BASE_URL}`;
        }
      }
    })();
  </script>
</body>
</html>
