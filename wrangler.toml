name = "qiji-website"
compatibility_date = "2026-09-01"
pages_build_output_dir = "."

# Cloudflare Workers AI binding —— 免費額度（10,000 Neurons/日），本機 `wrangler pages dev`
# 也會透過這個 binding 呼叫「遠端」的 Workers AI（本機沒有模型可跑），所以本機測試 LLM 回覆
# 時一樣會消耗當日的免費額度，數量不大，開發階段不用擔心。
#
# 正式站部署在 Cloudflare Pages 專案時，這個 binding 需要額外在
# Cloudflare Dashboard → Pages 專案 → Settings → Functions → AI bindings 手動加一次，
# 不會因為這個檔案存在就自動生效（Pages 的 Git 整合部署不會讀 [ai] 這一段）。
[ai]
binding = "AI"
